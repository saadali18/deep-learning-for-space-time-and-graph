<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI651 Assignment 2 Report</title>
<script>
window.MathJax = { tex: { inlineMath: [['\\(', '\\)']] }, svg: { fontCache: 'global' } };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js"></script>
<style>
/* LaTeX article look: Computer Modern (CMU) fonts, bundled locally in report/fonts */
@font-face { font-family: "CMU Serif"; src: url("fonts/cmu-serif-500-roman.woff2") format("woff2"); font-weight: normal; font-style: normal; }
@font-face { font-family: "CMU Serif"; src: url("fonts/cmu-serif-500-italic.woff2") format("woff2"); font-weight: normal; font-style: italic; }
@font-face { font-family: "CMU Serif"; src: url("fonts/cmu-serif-700-roman.woff2") format("woff2"); font-weight: bold; font-style: normal; }
@font-face { font-family: "CMU Serif"; src: url("fonts/cmu-serif-700-italic.woff2") format("woff2"); font-weight: bold; font-style: italic; }
@font-face { font-family: "CMU Typewriter"; src: url("fonts/cmu-typewriter-text-500-roman.woff2") format("woff2"); }

:root { --ink: #000000; --muted: #555555; --link: #c00000; --surface: #ffffff; }
@page { size: A4; margin: 24mm 24mm 22mm 24mm;
        @bottom-center { content: counter(page); font-family: "CMU Serif", serif; font-size: 10pt; } }
html { background: var(--surface); }
body { font-family: "CMU Serif", "Latin Modern Roman", serif; font-size: 10.5pt; line-height: 1.32; color: var(--ink);
       max-width: 162mm; margin: 0 auto; background: var(--surface); }

/* title block (like \maketitle) */
.front { text-align: center; margin: 6mm 0 8mm; }
.front .title { font-size: 17.3pt; line-height: 1.3; }
.front .author { font-size: 12pt; margin-top: 12pt; }
.front .author .roll { color: var(--link); }
.front .date { font-size: 12pt; margin-top: 8pt; }
.front .meta { text-align: left; margin-top: 18pt; font-size: 10.5pt; }
.front .meta p { margin: 2pt 0; text-align: left; }
.front .repo { font-size: 8.5pt; white-space: nowrap; color: var(--ink); text-decoration: none; }

/* sectioning (\section, \subsection, \subsubsection) */
h1 { font-size: 14.4pt; font-weight: bold; margin: 18pt 0 8pt; page-break-before: always; page-break-after: avoid; }
#q1 h1 { page-break-before: avoid; }
h2 { font-size: 12pt; font-weight: bold; margin: 14pt 0 5pt; page-break-after: avoid; }
h3 { font-size: 10.5pt; font-weight: bold; margin: 10pt 0 4pt; page-break-after: avoid; }
p { margin: 0 0 6pt; text-align: justify; hyphens: auto; }
.lead { font-size: 10.5pt; }
ul, ol { margin: 3pt 0 6pt; padding-left: 20pt; }
li { margin: 2pt 0; text-align: justify; }

/* answers: run-in bold heading, no boxes (like \paragraph) */
.qa { margin: 8pt 0 10pt; }
.qa > b:first-child { display: block; font-size: 10.5pt; margin: 10pt 0 3pt; page-break-after: avoid; }
.prereg { border: 0.6pt solid #000; padding: 5pt 8pt; margin: 10pt 0; }
.prereg > b:first-child { margin-top: 0; }
.prereg .stamp { font-size: 9pt; color: var(--muted); }

/* booktabs-style tables */
table { border-collapse: collapse; width: 100%; margin: 4pt 0 10pt; font-size: 9pt; line-height: 1.25; page-break-inside: auto; }
tr { page-break-inside: avoid; }
thead tr th { border-top: 1.1pt solid #000; border-bottom: 0.6pt solid #000; }
tbody tr:last-child td { border-bottom: 1.1pt solid #000; }
th { text-align: left; font-weight: normal; padding: 3pt 5pt; vertical-align: bottom; }
td { padding: 2.5pt 5pt; vertical-align: top; }
table.res td, table.res th { text-align: right; white-space: nowrap; }
table.res td:first-child, table.res th:first-child { text-align: left; }
table.small { font-size: 8pt; }
table.small td, table.small th { padding: 2pt 3pt; }
.seeds { color: var(--muted); font-size: 0.88em; }
tr.out td { font-weight: bold; }
.assume td:first-child { font-weight: bold; white-space: nowrap; }
.assume { font-size: 8.6pt; }
.limits { font-size: 8.6pt; table-layout: fixed; }

/* captions (Table n: / Figure n:) */
.tcap { font-size: 9.5pt; margin: 10pt 0 3pt; text-align: justify; break-after: avoid; page-break-after: avoid; }
figcaption { font-size: 9.5pt; margin: 4pt 0 12pt; text-align: justify; }
figure { margin: 10pt 0; page-break-inside: avoid; }
figure.multi { page-break-inside: auto; }
figure.multi img { page-break-inside: avoid; margin-bottom: 4pt; }
figure img { width: 100%; display: block; }
figure.half img { width: 52%; margin: 0 auto; }
figure.wide img { width: 100%; }

.eq { margin: 5pt 0 7pt; overflow-x: auto; font-size: 10pt; }
.todo { color: #b00020; font-weight: bold; }
code, .mono, .gifs { font-family: "CMU Typewriter", "Courier New", monospace; font-size: 9.5pt; }
.gifs { font-size: 8.6pt; }
.small-note { font-size: 9pt; color: var(--muted); }
</style>
</head>
<body>
<!--BODY-->
</body>
</html>
