<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI651 Assignment 2 Report</title>
<script>
window.MathJax = { tex: { inlineMath: [['\\(', '\\)']] }, svg: { fontCache: 'global' } };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js"></script>
<style>
:root {
  --ink: #0b0b0b; --ink2: #3d3c39; --muted: #6b6a66; --rule: #d6d5d0; --accent: #1f5f9e;
  --fill: #f4f6f9; --surface: #ffffff;
}
@page { size: A4; margin: 16mm 15mm 16mm 15mm; }
html { background: var(--surface); }
body { font-family: "Charter", "Georgia", serif; font-size: 10.3pt; line-height: 1.42; color: var(--ink);
       max-width: 182mm; margin: 0 auto; background: var(--surface); }
h1 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 17pt; color: var(--accent); margin: 0 0 8pt;
     page-break-before: always; }
section:first-of-type h1, .front h1 { page-break-before: avoid; }
h2 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 12.5pt; color: var(--accent); margin: 16pt 0 5pt;
     border-bottom: 1px solid var(--rule); padding-bottom: 2pt; page-break-after: avoid; }
h3 { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 10.8pt; margin: 12pt 0 4pt; page-break-after: avoid; }
p { margin: 4pt 0 6pt; text-align: justify; hyphens: auto; }
.lead { font-size: 10.5pt; }
ul, ol { margin: 3pt 0 6pt; padding-left: 18pt; }
li { margin: 2pt 0; }
table { border-collapse: collapse; width: 100%; margin: 6pt 0 10pt; font-size: 8.6pt; line-height: 1.3;
        page-break-inside: auto; }
tr { page-break-inside: avoid; }
th { background: var(--fill); text-align: left; font-family: "Helvetica Neue", Arial, sans-serif; font-weight: 600;
     border-top: 1.2px solid var(--ink2); border-bottom: 1px solid var(--ink2); padding: 3pt 4pt; vertical-align: bottom; }
td { border-bottom: 0.5px solid var(--rule); padding: 3pt 4pt; vertical-align: top; }
table.res td, table.res th { text-align: right; white-space: nowrap; }
table.res td:first-child, table.res th:first-child { text-align: left; }
table.small { font-size: 7.4pt; }
table.small td, table.small th { padding: 2.5pt 3pt; }
.seeds { color: var(--muted); font-size: 0.88em; }
tr.out td { background: #fbf6e6; }
.caption, figcaption { font-size: 8.8pt; color: var(--ink2); margin: 3pt 0 10pt; text-align: justify; }
.tcap { font-size: 8.8pt; color: var(--ink2); margin: 8pt 0 2pt; break-after: avoid; page-break-after: avoid; }
figure { margin: 8pt 0; page-break-inside: avoid; }
figure.multi { page-break-inside: auto; }
figure.multi img { page-break-inside: avoid; margin-bottom: 4pt; }
figure img { width: 100%; display: block; }
figure.half img { width: 52%; margin: 0 auto; }
figure.wide img { width: 100%; }
.eq { margin: 4pt 0 6pt; overflow-x: auto; font-size: 9.5pt; }
.qa { margin: 8pt 0 10pt; padding: 5pt 8pt; border-left: 3px solid var(--accent); background: #f8fafc;
      page-break-inside: auto; }
.qa > b:first-child { color: var(--accent); }
.prereg { border-left-color: #c98500; background: #fffaf0; }
.prereg .stamp { font-size: 8.4pt; color: var(--muted); font-family: "Helvetica Neue", Arial, sans-serif; }
.todo { color: #b00020; font-weight: bold; }
code, .mono { font-family: "SF Mono", Menlo, monospace; font-size: 8.6pt; }
.front { text-align: center; padding-top: 30mm; }
.front .title { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 22pt; color: var(--accent); margin: 6pt 0; }
.front .sub { font-size: 12pt; color: var(--ink2); }
.front table { width: 70%; margin: 18pt auto; font-size: 10pt; }
.front td { text-align: left; }
.toc { text-align: left; width: 70%; margin: 14pt auto; font-size: 10pt; }
.small-note { font-size: 8.6pt; color: var(--muted); }
.assume td:first-child { font-weight: bold; white-space: nowrap; }
.assume { font-size: 8.3pt; }
.gifs { font-family: "SF Mono", Menlo, monospace; font-size: 7.6pt; }
</style>
</head>
<body>

</body>
</html>
